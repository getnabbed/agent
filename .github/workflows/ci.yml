name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails only on vulnerabilities in code paths the agent actually calls.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  proto:
    name: Protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          setup_only: true
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Check for breaking changes against main
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code pkg/proto

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all release platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          call: build
      - name: Smoke test the amd64 image
        run: |
          docker buildx build --load -t agent:ci .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges agent:ci version
          docker run --rm agent:ci config | grep -q 'data_dir: /data'
          test "$(docker inspect -f '{{.Config.User}}' agent:ci)" = "65532:65532"

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, to tell whether the chart version is already released
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      # yq comes with the runner image.
      - run: ./helm/check.sh
      - name: Require a new chart version when the chart changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --quiet "$BASE" HEAD -- helm/nabbed-agent && exit 0
          version=$(yq '.version' helm/nabbed-agent/Chart.yaml)
          if git rev-parse -q --verify "refs/tags/chart/v$version" >/dev/null; then
            echo "::error file=helm/nabbed-agent/Chart.yaml::chart $version is already released; bump version in Chart.yaml"
            exit 1
          fi

  # Dev image for every merge to main, so main can be run and debugged
  # before a release. Built from the source Dockerfile and pushed as
  #   ghcr.io/wilderness-cloud/agent:main             (moves with main)
  #   ghcr.io/wilderness-cloud/agent:main-<sha12>     (one commit, never moves)
  # Never latest or a SemVer tag: those come only from release.yml. Signed
  # with cosign; verify against ci.yml@refs/heads/main, not the release
  # identity.
  dev-image:
    name: Dev image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint, vulnerabilities, proto, docker]
    runs-on: ubuntu-latest
    # Queue rather than cancel, so :main always ends on the newest commit.
    concurrency:
      group: dev-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write  # push to ghcr.io
      id-token: write  # keyless cosign signing
    env:
      IMAGE: ghcr.io/wilderness-cloud/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # SemVer prerelease, so it sorts below every release and anything
      # parsing the version the agent reports still can.
      - name: Compute version
        id: meta
        run: |
          short=${GITHUB_SHA::12}
          {
            echo "short=$short"
            echo "version=0.0.0-main.$short"
            echo "date=$(git log -1 --format=%cI)"
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:main-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}

      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          {
            echo "### Dev image"
            echo
            echo "- \`$IMAGE:main-$SHORT\`"
            echo "- \`$IMAGE@$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
