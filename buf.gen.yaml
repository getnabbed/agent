version: v2
managed:
  enabled: true
  override:
    # Generated code mirrors the proto path under pkg/proto:
    #   proto/nabbed/agent/v2/agent.proto
    #   -> import agentv2 "github.com/getnabbed/agent/pkg/proto/nabbed/agent/v2"
    - file_option: go_package_prefix
      value: github.com/getnabbed/agent/pkg/proto
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: pkg/proto
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: pkg/proto
    opt: paths=source_relative
inputs:
  - directory: proto
