version: v2
modules:
  - path: proto
    name: buf.build/nabbed/agent
lint:
  use:
    - STANDARD
  except:
    # Connect is a single bidi stream whose envelopes are named for their
    # direction (AgentMessage up, ControlMessage down) per design 0001.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
