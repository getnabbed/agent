{{- if .Values.usenet.providers }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nabbed-agent.usenetSecretName" . }}
  labels:
    {{- include "nabbed-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.usenet.secretKey }}: {{ .Values.usenet.providers | quote }}
{{- end }}
