apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nabbed-agent.fullname" . }}
  labels:
    {{- include "nabbed-agent.labels" . | nindent 4 }}
data:
  agent.yaml: |
    # Generated by the nabbed-agent Helm chart from values.config.
    # name, data_dir, downloads.dir and torrent.port come from the
    # environment, which overrides this file.
    {{- include "nabbed-agent.config" . | nindent 4 }}
  {{- with .Values.tls.caBundle }}
  ca.pem: |
    {{- . | nindent 4 }}
  {{- end }}
